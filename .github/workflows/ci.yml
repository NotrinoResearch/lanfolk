# CI is intentionally manual-only for now (docs/DECISIONS.md D-002).
# To enable it again, add:
#   push:
#     branches: [main]
#   pull_request:
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  natsim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Kernel modules for tc netem (best effort)
        run: sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
      - name: NAT simulation
        run: test/natsim/run-local.sh
      - name: Job summary
        if: always()
        run: test -f test/natsim/out/summary.md && cat test/natsim/out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natsim-out
          path: test/natsim/out/

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build relay image
        run: docker build -f deploy/relay/Dockerfile -t lanfolk-relay:ci .
      - name: Scan relay image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lanfolk-relay:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Lanfolk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar" id="titlebar">
    <div class="tb-brand" id="tb-brand"></div>
    <div class="tb-actions">
      <button type="button" class="tb-btn" id="tb-settings" title="Settings" aria-label="Settings"></button>
      <button type="button" class="caption" id="tb-min" title="Minimize" aria-label="Minimize"></button>
      <button type="button" class="caption caption-close" id="tb-close" title="Close to the notification area" aria-label="Close to the notification area"></button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="menu" class="menu" role="menu" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="format.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Lanfolk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div id="offline" class="offline" hidden>
    <div class="offline-box" role="alert">
      <h1 id="offline-title">The Lanfolk service is not running</h1>
      <p>Lanfolk needs its background service to connect you to your friends. Start the Lanfolk service, or restart your computer if it was just installed.</p>
      <p id="offline-detail" class="muted"></p>
      <p class="muted">This window reconnects by itself as soon as the service is available.</p>
      <button id="retry" type="button" class="primary">Retry</button>
    </div>
  </div>

  <div id="shell" class="shell" hidden>
    <nav class="nav" aria-label="Main">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Lanfolk</div>
      <ul id="nav-list"></ul>
    </nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <footer id="statusbar" class="statusbar" aria-label="Connection status" hidden></footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="format.js"></script>
  <script src="app.js"></script>
</body>
</html>
